[project]
name = "vibelearning-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "python-dotenv>=1.2.4",
]
[dependency-groups]
dev = ["pytest", "httpx"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
