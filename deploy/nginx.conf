# Put an HTTPS-terminating ingress in front; expose only the ingress publicly.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location /api/ops/ { return 404; } # Operator metrics use private backend network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Deliberately do not trust a client's forwarded identity headers.
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 125s;
        proxy_request_buffering on;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
