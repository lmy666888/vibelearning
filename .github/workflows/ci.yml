name: CI

on:
  pull_request:
    branches: [main, feat/ai-guardrails-usage-governance, feat/double-slit-interference, feat/kepler-orbital-mechanics]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run Vitest
        run: npm test
      - name: Run strict TypeScript checks
        run: npm run typecheck
      - name: Build production assets
        run: npm run build
      - name: Install Chromium and Linux system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run mocked Chromium end-to-end tests
        run: npm run test:e2e

  backend:
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
      LLM_API_KEY: ''
      LLM_MODEL: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.7'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        run: uv sync --python 3.13 --locked
      - name: Run mocked backend tests
        run: uv run --locked pytest
